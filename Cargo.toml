[package]
name = "gitclean"
version = "0.1.0"
edition = "2021"
description = "Safely find and clean generated build and cache directories in developer projects"
license = "MIT"
repository = "https://github.com/BLCCoreStudio/GitClean"
readme = "README.md"
keywords = ["git", "cleanup", "cache", "build", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
